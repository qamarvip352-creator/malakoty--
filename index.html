<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ستار ديما - عالم الكرتون</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background-color: #1e293b;
            padding: 15px;
            border-bottom: 3px solid #38bdf8;
        }
        h1 {
            color: #38bdf8;
            margin: 0;
            font-size: 24px;
        }
        .container {
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>✨ عالم ستار ديما للكرتون ✨</h1>
    </header>

    <div class="container">
        <h2>أهلاً بكِ في موقع الكرتون!</h2>
        
        <div class="card">
            <h3>مشغل الفيديو (معاينة)</h3>
            <video controls poster="https://via.placeholder.com/500x280/1e293b/38bdf8?text=Cartoon">
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            </video>
        </div>
    </div>

</body>
</html>

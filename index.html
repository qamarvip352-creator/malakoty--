<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Malakoty 👑</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #fff0f5, #ffccd5); 
            color: #880e4f; 
            font-family: 'Tahoma', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .container {
            width: 90%;
            max-width: 450px;
            padding: 20px;
            text-align: center;
        }
        .login-card { 
            background: #ffffff; 
            padding: 40px 30px; 
            border-radius: 30px; 
            box-shadow: 0 15px 35px rgba(233, 30, 99, 0.25); 
            border: 3px dashed #ff80ab;
        }
        .login-card h2 {
            color: #d81b60;
            margin-bottom: 15px;
            font-size: 26px;
        }
        input { 
            padding: 14px 20px; 
            margin: 20px 0; 
            width: 100%; 
            border-radius: 30px; 
            border: 2px solid #ff80ab; 
            background: #fff5f8; 
            color: #ad1457; 
            text-align: center;
            font-size: 18px;
            outline: none;
        }
        .btn { 
            padding: 14px; 
            width: 100%; 
            background: linear-gradient(45deg, #ff4081, #e91e63); 
            color: white; 
            border: none; 
            border-radius: 30px; 
            cursor: pointer; 
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(233, 30, 99, 0.4);
        }
        .content-box {
            display: none;
        }
        .card {
            background: #ffffff;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(233, 30, 99, 0.15);
            border: 2px solid #ffc1e3;
            text-align: center;
        }
        .card h3 {
            color: #c2185b;
            margin-top: 0;
            margin-bottom: 15px;
        }
        .song-item {
            background: #fff0f5;
            padding: 15px;
            margin: 12px 0;
            border-radius: 18px;
            border: 1px solid #ffb6c1;
        }
        .song-item p {
            margin: 0 0 8px 0;
            font-weight: bold;
            color: #ad1457;
        }
        audio {
            width: 100%;
            outline: none;
        }
        .xo-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 240px;
            margin: 15px auto;
        }
        .xo-cell {
            aspect-ratio: 1;
            background: #fff0f5;
            border: 2px solid #ff80ab;
            border-radius: 15px;
            font-size: 32px;
            font-weight: bold;
            color: #d81b60;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        #xoStatus {
            margin-top: 10px;
            font-weight: bold;
            color: #c2185b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- تسجيل الدخول -->
        <div class="login-card" id="loginBox">
            <h2>👑 Malakoty </h2>
            <p>ادخلي كلمة السر يملوكتي 😍😘</p>
            <input type="password" id="passInput" placeholder="كلمة المرور">
            <br>
            <button class="btn" onclick="checkPass()">دخول</button>
        </div>

        <!-- المحتوى الأساسي -->
        <div class="content-box" id="mainContent">
            
            <!-- أغنية نانسي (في الأول) -->
            <div class="card">
                <h3>🎵 الأغاني</h3>
                <div class="song-item">
                    <p>Nancy</p>
                    <audio controls preload="auto">
                        <source src="nancy.mp3" type="audio/mp3">
                    </audio>
                </div>
            </div>

            <!-- لعبة إكس أو -->
            <div class="card">
                <h3>🎮 لعبة X/O</h3>
                <div class="xo-board" id="xoBoard">
                    <div class="xo-cell" onclick="makeMove(0)"></div>
                    <div class="xo-cell" onclick="makeMove(1)"></div>
                    <div class="xo-cell" onclick="makeMove(2)"></div>
                    <div class="xo-cell" onclick="makeMove(3)"></div>
                    <div class="xo-cell" onclick="makeMove(4)"></div>
                    <div class="xo-cell" onclick="makeMove(5)"></div>
                    <div class="xo-cell" onclick="makeMove(6)"></div>
                    <div class="xo-cell" onclick="makeMove(7)"></div>
                    <div class="xo-cell" onclick="makeMove(8)"></div>
                </div>
                <p id="xoStatus">الدور على: X</p>
                <button class="btn" onclick="resetXO()" style="margin-top: 10px; padding: 8px; font-size: 14px;">إعادة اللعبة</button>
            </div>

            <!-- أغنية توليت (في الآخر) -->
            <div class="card">
                <div class="song-item">
                    <p>tul8te</p>
                    <audio controls preload="auto">
                        <source src="tul8te.mp3.mp3" type="audio/mp3">
                    </audio>
                </div>
            </div>

        </div>
    </div>

    <script>
        function checkPass() {
            var correctPass = "malak567"; 
            var userPass = document.getElementById("passInput").value;
            
            if (userPass === correctPass) {
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("mainContent").style.display = "block";
            } else {
                alert("كلمة سر غلط يا ملوكتي حاولي مره كمان 😍😘");
                document.getElementById("passInput").value = ""; 
            }
        }

        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let isGameActive = true;

        function makeMove(index) {
            if (board[index] === "" && isGameActive) {
                board[index] = currentPlayer;
                document.getElementsByClassName("xo-cell")[index].innerText = currentPlayer;
                checkWinner();
                if (isGameActive) {
                    currentPlayer = currentPlayer === "X" ? "O" : "X";
                    document.getElementById("xoStatus").innerText = "الدور على: " + currentPlayer;
                }
            }
        }

        function checkWinner() {
            const winConditions = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];

            let roundWon = false;
            for (let i = 0; i < winConditions.length; i++) {
                let [a, b, c] = winConditions[i];
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                document.getElementById("xoStatus").innerText = "فاز اللاعب " + currentPlayer;
                isGameActive = false;
                return;
            }

            if (!board.includes("")) {
                document.getElementById("xoStatus").innerText = "تعادل";
                isGameActive = false;
            }
        }

        function resetXO() {
            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            isGameActive = true;
            document.getElementById("xoStatus").innerText = "الدور على: X";
            let cells = document.getElementsByClassName("xo-cell");
            for (let i = 0; i < cells.length; i++) {
                cells[i].innerText = "";
            }
        }
    </script>

</body>
</html>

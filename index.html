<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Malakoty 👑</title>
    <style>
        body { 
            background: #121212; 
            color: #fff; 
            font-family: Tahoma, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .box { 
            background: #1e1e1e; 
            padding: 40px; 
            border-radius: 12px; 
            text-align: center; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.6); 
            width: 300px;
        }
        input { 
            padding: 12px; 
            margin: 15px 0; 
            width: 100%; 
            border-radius: 6px; 
            border: 1px solid #444; 
            background: #2c2c2c; 
            color: #fff; 
            box-sizing: border-box;
            text-align: center;
            font-size: 16px;
        }
        button { 
            padding: 12px; 
            width: 100%; 
            background: #e50914; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background: #b20710;
        }
    </style>
</head>
<body>

    <!-- صندوق تسجيل الدخول -->
    <div class="box" id="loginBox">
        <h2>موقع ملوكي 👑</h2>
        <p>الرجاء إدخال كلمة المرور للمتابعة:</p>
        <input type="password" id="passInput" placeholder="كلمة المرور">
        <br>
        <button onclick="checkPass()">دخول</button>
    </div>

    <!-- محتوى الموقع الأساسي (يظهر فقط عند صحة كلمة المرور) -->
    <div id="mainContent" style="display:none; text-align:center;">
        <h1>أهلاً بكِ في عالمكِ الخاص يا ملوكي ✨</h1>
        <p>تم تسجيل الدخول بنجاح.</p>
        <!-- تقدري تحطي هنا أي أكواد أو عناصر تانية تخص موقعك والأغاني -->
    </div>

    <script>
        function checkPass() {
            // كلمة المرور المحددة
            var correctPass = "malak567"; 
            var userPass = document.getElementById("passInput").value;
            
            if (userPass === correctPass) {
                // لو كلمة المرور صحيحة، اخفِ صفحة تسجيل الدخول وأظهر الموقع
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("mainContent").style.display = "block";
            } else {
                // لو كلمة المرور خطأ، يتم منع الدخول تماماً
                alert("كلمة المرور غير صحيحة! عذراً، لا يمكنك دخول الموقع.");
                document.getElementById("passInput").value = ""; 
            }
        }
    </script>

</body>
</html>

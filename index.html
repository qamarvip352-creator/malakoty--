<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Malakoty</title>
    <style>
        body { background: #121212; color: #fff; font-family: Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e1e1e; padding: 30px; border-radius: 10px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input { padding: 10px; margin: 10px 0; width: 80%; border-radius: 5px; border: 1px solid #444; background: #2c2c2c; color: #fff; text-align: center; }
        button { padding: 10px 20px; background: #e50914; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="box" id="loginBox">
        <h2>مرحباً بكِ في موقع ملوكي 👑</h2>
        <p>الرجاء إدخال كلمة المرور للمتابعة:</p>
        <input type="password" id="passInput" placeholder="كلمة المرور">
        <br>
        <button onclick="checkPass()">دخول</button>
    </div>

    <div id="mainContent" style="display:none; text-align:center;">
        <h1>أهلاً بكِ يا ملوكي، تم الدخول بنجاح!</h1>
    </div>

    <script>
        function checkPass() {
            var correctPass = "malak567"; 
            var userPass = document.getElementById("passInput").value;
            
            if (userPass === correctPass) {
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("mainContent").style.display = "block";
            } else {
                alert("كلمة سر غلط يا ملوكتي حاولي مره كمان 😍😘");
                document.getElementById("passInput").value = "";
            }
        }
    </script>

</body>
</html>
